---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cs-mikrotik-bouncer
  namespace: security
spec:
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      interval: 30m
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  interval: 30m
  install:
    createNamespace: true
  values:
    controllers:
      main:
        strategy: Recreate
        containers:
          main:
            image:
              repository: ghcr.io/funkolab/cs-mikrotik-bouncer
              tag: v0.7.3@sha256:cba66ac5eb32c98fee2d139311024419adf064bc6eb16886c004cdea747a0b0b
              pullPolicy: IfNotPresent
            env:
              CROWDSEC_BOUNCER_API_KEY: "${SECRET_CROWDSEC_BOUNCER_API_KEY}"
              CROWDSEC_URL: "${SECRET_CROWDSEC_URL}"
              MIKROTIK_HOST: "${SECRET_MIKROTIK_HOST}"
              MIKROTIK_USER: "${SECRET_MIKROTIK_USER}"
              MIKROTIK_PASS: "${SECRET_MIKROTIK_PASS}"
              MIKROTIK_TLS: "false"
              MIKROTIK_IPV6: "false"
              LOG_LEVEL: "1"
