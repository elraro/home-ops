---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app starwarssounds
  namespace: telegram
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.0.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3

  values:
    controllers:
      main:
        replicas: 1
        strategy: RollingUpdate
        containers:
          mariadb:
            image:
              repository: mariadb
              tag: latest
              pullPolicy: IfNotPresent
            env:
              MYSQL_ROOT_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: starwarssounds
                    key: mysqlrootpassword
              MYSQL_DATABASE:
                valueFrom:
                  secretKeyRef:
                    name: starwarssounds
                    key: mysqldatabase
              MYSQL_USER:
                valueFrom:
                  secretKeyRef:
                    name: starwarssounds
                    key: mysqluser
              MYSQL_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: starwarssounds
                    key: mysqlpassword
            resources:
              requests:
                cpu: 15m
                memory: 105Mi
              limits:
                cpu: 30m
                memory: 150Mi
          main:
            image:
              repository: ghcr.io/elraro/starwarssounds_bot
              tag: "1.0.0"
              pullPolicy: IfNotPresent
            env:
              MYSQL_HOST: "localhost"
              MYSQL_PORT: "3306"
              TELEGRAM_BOT_TOKEN: "${SECRET_STARWARSSOUNDS_TOKEN}"
              TELEGRAM_USER_ALIAS:
                valueFrom:
                  secretKeyRef:
                    name: starwarssounds
                    key: telegramuseralias
              WEBHOOK_HOST: "botstelegram.${SECRET_DOMAIN}"
              WEBHOOK_PORT: "443"
              WEBHOOK_LISTEN: "0.0.0.0"
              WEBHOOK_LISTEN_PORT: "8080"
            resources:
              requests:
                cpu: 15m
                memory: 100Mi
              limits:
                cpu: 30m
                memory: 150Mi

    service:
      main:
        controller: main
        ports:
          http:
            port: 8080
            protocol: TCP

    persistence:
      mariadb-volume:
        enabled: true
        type: hostPath
        hostPath: /home/elraro/home-ops/volumes/starwarssounds/mariadb-starwarssounds-volume
        advancedMounts:
          main:
            mariadb:
              - path: /var/lib/mysql

    defaultPodOptions:
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      terminationGracePeriodSeconds: 60

    podAnnotations:
      kustomize.toolkit.fluxcd.io/substitute: "enabled"
