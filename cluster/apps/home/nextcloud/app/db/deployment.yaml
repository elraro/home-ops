---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: &app mariadb-nextcloud
  namespace: home
  labels:
    app.kubernetes.io/name: *app
    app.kubernetes.io/instance: *app
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: *app
      app.kubernetes.io/instance: *app
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: *app
        app.kubernetes.io/instance: *app
    spec:
      containers:
        - name: *app
          image: mariadb:11.8
          imagePullPolicy: Always
          args:
            - --slow-query-log=ON
            - --long-query-time=2
            - --tmp-table-size=64M
            - --max-heap-table-size=64M
            - --innodb-log-file-size=256M
          volumeMounts:
            - name: mariadb-nextcloud-volume
              mountPath: /var/lib/mysql
          env:
            - name: MARIADB_AUTO_UPGRADE
              value: "yes"
            - name: MYSQL_ROOT_PASSWORD
              value: "${MARIADBNEXTCLOUD_ROOT_PASS}"
            - name: MYSQL_DATABASE
              value: "${MARIADBNEXTCLOUD_DATABASE}"
            - name: MYSQL_USER
              value: "${MARIADBNEXTCLOUD_USERNAME}"
            - name: MYSQL_PASSWORD
              value: "${MARIADBNEXTCLOUD_PASSWORD}"
      restartPolicy: Always
      terminationGracePeriodSeconds: 60
      volumes:
        - name: mariadb-nextcloud-volume
          hostPath:
            path: /mnt/sdc1/mariadb_nextcloud
