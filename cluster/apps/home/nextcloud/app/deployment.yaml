apiVersion: apps/v1
kind: Deployment
metadata:
  name: &app nextcloud
  namespace: home
  labels:
    app.kubernetes.io/name: *app
    app.kubernetes.io/instance: *app
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: *app
      app.kubernetes.io/instance: *app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: *app
        app.kubernetes.io/instance: *app
    spec:
      containers:
        - name: nextcloud
          image: linuxserver/nextcloud:35.0.3@sha256:1c3cfb00eb8653e03042653065e848523edf177498b439fcfdddff5ecd355e1a
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: nextcloud-config-volume
              mountPath: /config
            - name: nextcloud-data-volume
              mountPath: /data
            - name: nextcloud-patches-volume
              mountPath: /custom-cont-init.d
          env:
            - name: PGID
              value: "1000"
            - name: PUID
              value: "1000"
            - name: TZ
              value: "${TZ}"
      restartPolicy: Always
      terminationGracePeriodSeconds: 60
      volumes:
        - name: nextcloud-config-volume
          hostPath:
            path: /home/elraro/home-ops/volumes/nextcloud/nextcloud-config-volume
        - name: nextcloud-data-volume
          hostPath:
            path: /mnt/sdc1/nextcloud/data
        - name: nextcloud-patches-volume
          hostPath:
            path: /home/elraro/home-ops/volumes/nextcloud/nextcloud-patches-volume
